<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>College Complaint Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
    }

    .container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .register-btn {
      background-color: #00c9ff;
      border: none;
      padding: 15px 35px;
      font-size: 1.1rem;
      color: #fff;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .register-btn:hover {
      background-color: #0088cc;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.2rem;
      }

      p {
        font-size: 1rem;
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>
<div class="container">
    <h1>Welcome to College Complaint Management System</h1>
    <p>Your voice matters. Easily report and track issues directly to the college administration. Join us in improving our campus environment.</p>
    <button class="register-btn" onclick="redirectToRegister()">Register</button>
</div>
  <script>
    function redirectToRegister() {
      // Replace with actual registration page
      window.location.href = "register.php";
    }
  </script>
</body>
</html>
